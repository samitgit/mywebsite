<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Samit Ghosh</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        header {
            text-align: center;
            margin-top: 20px;
        }

        section#contact {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section#contact h2 {
            text-align: center;
            color: #2c3e50;
        }

        section#contact p {
            text-align: center;
            color: #34495e;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input, textarea {
            padding: 10px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
        }

        button {
            width: 150px;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background-color: #2c3e50;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            align-self: center;
        }

        button:hover {
            background-color: #34495e;
        }

        .social-media {
            text-align: center;
            margin-top: 30px;
        }

        .social-media img {
            width: 40px;
            margin: 0 10px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px 0;
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>
    <header>
        <h1>Contact Me</h1>
        <p>Have questions, collaboration ideas, or just want to connect? Reach out below!</p>
    </header>

    <section id="contact">
        <!-- Contact Form -->
        <form action="mailto:samit.ghosh.du@gmail.com" method="post" enctype="text/plain">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>

        <!-- Social Media Links -->
        <div class="social-media">
            <h3>Connect with me:</h3>
            <a href="https://x.com/Ghosh_Samit13" target="_blank">
                <img src="X.png" alt="X">
            </a>
            <a href="https://www.linkedin.com/in/samitgkghosh" target="_blank">
                <img src="Linkedin.png" alt="LinkedIn">
            </a>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Samit Ghosh | All rights reserved.</p>
    </footer>
</body>
</html>
